    - Modul 1 – Erste VM: modul-1-vm.md
    - Modul 2 – Storage & Website: modul-2-storage.md
    - Modul 3 – Azure KI: modul-3-ai.md
    - Modul 4 – Monitoring & Kosten: modul-4-monitoring.md
    - Modul 5 – App Service: modul-5-appservice.md
    - Modul 6 – Azure Functions: modul-6-functions.md
    - Modul 7 – Aufräumen: modul-7-aufräumen.md
  - Lernpfad 2 – Netzwerk & Sicherheit:
    - Modul 8 – Virtual Network: modul-8-vnet.md
    - Modul 9 – Network Security Groups: modul-9-nsg.md
    - Modul 10 – Azure Bastion: modul-10-bastion.md
    - Modul 11 – Load Balancer: modul-11-loadbalancer.md
    - Modul 12 – Key Vault: modul-12-keyvault.md
    - Modul 13 – Private Endpoints: modul-13-privateendpoints.md
    - Modul 14 – Aufräumen: modul-14-aufräumen.md
  - Lernpfad 3 – Datenbanken:
    - Modul 15 – Azure SQL Database: modul-15-sql.md
    - Modul 16 – Cosmos DB: modul-16-cosmosdb.md
